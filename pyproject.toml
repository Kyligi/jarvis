[project]
name = "jarvis"
version = "1.0.0"
description = "Assistant personnel modulaire pour Omarchy"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8",
    "psutil>=6",
]

[project.scripts]
jarvis = "jarvis.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
